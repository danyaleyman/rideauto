# Alertmanager. UI: http://127.0.0.1:9093
# Slack webhook не в git — файл на сервере, см. docs/MONITORING.md.

global:
  resolve_timeout: 5m

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: slack-webhook
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack-webhook
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook
        send_resolved: true
        title: '{{ template "slack.ru.title" . }}'
        text: '{{ template "slack.ru.text" . }}'

inhibit_rules: []
