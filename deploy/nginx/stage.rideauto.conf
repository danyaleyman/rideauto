# Стейджинг. Не путать с rideauto.ru.
# http://stage.rideauto.ru  (нужна A-запись на тот же IP)
# http://88.210.63.45:8088  (сразу, без DNS)
#
# sudo cp deploy/nginx/stage.rideauto.conf /etc/nginx/sites-available/stage.rideauto.conf
# sudo ln -sf /etc/nginx/sites-available/stage.rideauto.conf /etc/nginx/sites-enabled/stage.rideauto.conf
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 8088 default_server;
    server_name stage.rideauto.ru;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3010;
    }
}
