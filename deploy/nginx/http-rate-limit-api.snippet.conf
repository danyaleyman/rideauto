# Подключить ОДИН РАЗ в блок http { } главного nginx.conf (рядом с proxy_cache_path):
#
#   include /opt/rideauto/deploy/nginx/http-rate-limit-api.snippet.conf;
#
# Затем в server { } для rideauto.ru — limit_req в location /api/ (см. rideauto.conf).

# ~10 r/s на IP в среднем, burst для всплесков каталога
limit_req_zone $binary_remote_addr zone=wra_api_public:20m rate=10r/s;
# Жёстче для auth/magic-link (защита от брутфорса без Redis)
limit_req_zone $binary_remote_addr zone=wra_api_auth:10m rate=2r/s;
