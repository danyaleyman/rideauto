# Правила Prometheus для RideAuto API и batch-job (node_exporter textfile).
# Подключение: в prometheus.yml
#   rule_files:
#     - "alert_rules_rideauto.yml"
# Подстройте пороги и job-лейблы под свой деплой.

groups:
  - name: rideauto_catalog_http
    interval: 30s
    rules:
      # SLO burn (docs/SLO.md): tight threshold for budget awareness
      - alert: RideautoSearchSloBurnP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(wra_http_request_duration_seconds_bucket{path_group="/api/search"}[5m])
            )
          ) > 0.35
        for: 10m
        labels:
          severity: warning
          class: slo_burn
        annotations:
          summary: "SLO burn: p95 /api/search > 350ms"
          description: "См. docs/SLO.md. Не путать с ops_pain (3s)."

      - alert: RideautoSearchHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(wra_http_request_duration_seconds_bucket{path_group="/api/search"}[5m])
            )
          ) > 3
        for: 10m
        labels:
          severity: warning
          class: ops_pain
        annotations:
          summary: "Ops pain: p95 /api/search > 3s"
          description: "Проверить Meilisearch, Postgres, Redis-кэш."

      - alert: RideautoCatalog5xxRate
        expr: |
          (
            sum(rate(wra_http_requests_total{status_class="5xx", path_group=~"/api/(search|car.*|facets).*"}[5m]))
            /
            sum(rate(wra_http_requests_total{path_group=~"/api/(search|car.*|facets).*"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Доля 5xx на каталоге API > 5%"
          description: "Проверить логи uvicorn и зависимости."

      - alert: RideautoSearchResponseBodyP95Large
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(wra_http_response_body_bytes_bucket{path_group="/api/search"}[10m])
            )
          ) > 1048576
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Большой p95 размер ответа /api/search"
          description: "Порог 1 MiB — при необходимости ужать slim или кэш."

  - name: rideauto_catalog_jobs
    interval: 60s
    rules:
      - alert: RideautoJobLastRunFailed
        expr: wra_job_last_exit_code != 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Batch job завершилась с ошибкой ({{ $labels.job }})"
          description: "Проверить journalctl / лог cron; EXIT_CODE в textfile."

      - alert: RideautoMeilisearchSyncStale
        expr: |
          (time() - wra_job_last_completion_unixtime{job="wra_meilisearch_sync"}) > 93600
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Давно не было успешного wra_meilisearch_sync (>26h)"
          description: "Проверить timer systemd и DSN; при другом JOB_NAME поправьте правило."

      - alert: RideautoPostgresCatalogSyncStale
        expr: |
          (time() - wra_job_last_completion_unixtime{job="wra_postgres_catalog_sync"}) > 93600
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Давно не отмечалось завершение wra_postgres_catalog_sync"
          description: "Если job не пишет метрики — отключите правило или задайте JOB_NAME."

      - alert: RideautoCatalogPipelineStale
        expr: |
          (time() - wra_job_last_completion_unixtime{job="wra_catalog_pipeline"}) > 93600
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Catalog Pipeline давно не завершался (>26h)"
          description: "Проверьте rideauto-catalog-pipeline.timer и journalctl."

      - alert: RideautoCatalogIndexEmpty
        expr: wra_catalog_index_empty == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Live Meilisearch index has zero documents"
          description: "После recreate/preflight fail каталог пуст. Запустите catalog pipeline с blue/green swap."

      - alert: RideautoCatalogMeiliPgLagHigh
        expr: |
          wra_catalog_meili_pg_ratio < 0.85
          and wra_catalog_pg_active_rows > 1000
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Meili docs << PG active rows (ratio < 0.85)"
          description: "Возможен отстающий sync или агрессивный distinct/dedupe. См. catalog_pipeline_lag_metrics."

      - alert: RideautoMeiliOutboxBacklogHigh
        expr: wra_meili_outbox_pending > 500
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Meili outbox backlog > 500"
          description: "Инкремент отстаёт от batch pipeline. Проверьте meili-outbox timer / ADR 0004."

  - name: rideauto_pricing_truth
    interval: 60s
    rules:
      - alert: RideautoPricingRecomputeQueueHigh
        expr: wra_pricing_needs_recompute_rows > 5000
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "needs_pricing_recompute queue > 5000 for 6h"
          description: "Запустите catalog pipeline с ценами / repair_*_pricing_recompute_queue.py."

      - alert: RideautoPricingRecomputeQueueCritical
        expr: wra_pricing_needs_recompute_rows > 50000
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "needs_pricing_recompute queue critically large"
          description: "Каталог может отдавать устаревшие цены/tier."

  - name: rideauto_che168_scraper
    interval: 60s
    rules:
      - alert: RideautoChe168HttpErrorsHigh
        expr: |
          (
            che168_http_final_http_errors_total
            /
            clamp_min(che168_http_requests_total, 1)
          ) > 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Che168: высокая доля final HTTP errors"
          description: "final_http_errors / requests_total > 15% за последние прогоны."

      - alert: RideautoChe168CircuitBreakerActive
        expr: increase(che168_http_circuit_breaker_opened_total[30m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Che168: circuit breaker открывался"
          description: "Проверьте session/proxy/429-403 паттерн и доступ к globalapi.che168.com."

      - alert: RideautoChe168DetailFailSpike
        expr: che168_scraper_detail_fail_total > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Che168: много detail_fail в прогоне"
          description: "detail_fail_total > 50. Возможен бан/прокси-деградация/API drift."

  - name: rideauto_encar_scraper
    interval: 60s
    rules:
      - alert: RideautoEncarHttpErrorsHigh
        expr: |
          (
            encar_http_final_http_errors_total
            /
            clamp_min(encar_http_requests_total, 1)
          ) > 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Encar: высокая доля final HTTP errors"
          description: "final_http_errors / requests_total > 15% за последние прогоны."

      - alert: RideautoEncarCircuitBreakerActive
        expr: increase(encar_http_circuit_breaker_opened_total[30m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Encar: circuit breaker открывался"
          description: "Проверьте прокси/IP пулы и статус Encar API."

      - alert: RideautoEncarDetailFailSpike
        expr: encar_scraper_detail_fail_total > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Encar: много detail_fail в прогоне"
          description: "detail_fail_total > 50. Возможен бан/прокси-деградация/API drift."
