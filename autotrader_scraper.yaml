# Autotrader USA — отдельный конфиг (не смешивать с Encar / Che168).
# Сессия: Playwright bootstrap → cookie cache → curl_cffi HTTP (без ручных Cookie каждый раз).
# Прокси: AUTOTRADER_PROXY_URL(S); если пусто — подхватывается ENCAR_PROXY_URLS (один FloppyData-пул).
# На DE-4 не поднимать параллельно с полным дампом Encar.

checkpoint:
  scope: autotrader

http:
  concurrency: 4
  timeout_total: 45
  timeout_connect: 15
  timeout_sock_read: 35
  list_page_delay_min: 0.4
  list_page_delay_max: 1.2
  transport: curl_cffi
  impersonate: chrome131

# Health-quarantine мёртвых прокси (общий ProxyPool). URL — из env (см. session.py).
proxy:
  enabled: true
  rotation: round_robin
  failure_threshold: 3
  quarantine_sec: 120

storage:
  backend: postgres
  store_raw_responses: true
  count_cars_source: autotrader
  postgres:
    dsn: ""

autotrader:
  base_url: https://www.autotrader.com
  cookie_file: ""
  cookie: ""
  auto_bootstrap: true
  skip_playwright_bootstrap: false
  bootstrap_start_url: https://www.autotrader.com/cars-for-sale/all-cars
  # Residential US proxy (Akamai). Env предпочтительнее YAML:
  # AUTOTRADER_PROXY_URL / AUTOTRADER_PROXY_URLS=http://u:p@host:port,...
  bootstrap_proxy_url: ""
  session_file: /var/lib/rideauto/autotrader_session.json
  # Слабая/битая cookie-сессия (после challenge) не должна жить часами.
  session_max_age_sec: 1800
  playwright_headless: true
  # Longer budgets: VDP gallery/features otherwise time out and cars fall back to SRP (1 photo).
  playwright_timeout_ms: 120000
  playwright_post_load_wait_ms: 5000
  challenge_retries: 3
  # playwright = fetch SRP/VDP inside Chromium (needed for Akamai + residential proxy)
  # http = curl_cffi after cookie bootstrap (often blocked again by Akamai)
  fetch_mode: playwright
  fetch_vdp: true
  # Do not save SRP-only stubs when VDP is required (keep trying instead of catalog noise).
  require_vdp: true
  vdp_retries: 3
  start_page: 1
  # 0 = без потолка (как Encar/Che168 max_cars: 0).
  max_pages: 0
  max_cars: 0
  # 2 sticky VDP-воркера — безопаснее по RAM/Akamai на DE-4 (16G).
  detail_concurrency: 2
  detail_concurrency_force: false
  # Отдельный Chromium+egress на воркера; при challenge ротируется только этот слот.
  sticky_browser_slots: true

  # --- Двухфазный контур (discovery → scraper_pending_ids → detail) -------------
  # Prod: WRA_SUPERVISOR_AT_SPLIT=1 → list + detail раздельно (см. supervisor).
  phase: all
  # Пауза SRP, пока pending не просядет (0 = не паузить).
  list_pause_when_pending_above: 10000
  # Сколько id забирать из очереди за одну итерацию detail-воркеров.
  pending_batch_size: 300
  # Сколько секунд ждать пустой очереди (SPLIT detail ждёт list столько же).
  pending_idle_sec: 600
  # Сколько прогонов VDP допускается на карточку, прежде чем выкинуть её из очереди.
  vdp_max_attempts: 3
  # Попытки внутри одного прогона (браузерные страницы падают пачками при Akamai).
  srp_retries: 5
  # Сколько fail-циклов hold+recover на одной странице до сброса streak (не выход!).
  srp_stall_pages_limit: 4
  # Возобновлять SRP-курсор из scraper_checkpoint_state (не начинать с page=1).
  resume_cursor: true

  # --- Покрытие национальной выдачи (срезы) ------------------------------------
  # Autotrader показывает ~3.4-3.5 млн лотов, но пагинация упирается в потолок
  # глубины: дальние страницы отдают HTML без __NEXT_DATA__ (Akamai «конец выдачи»).
  # Поэтому каталог идёт СРЕЗАМИ price × year: у каждого свой фильтр и свой курсор
  # (srp:<name>), а в конце каждого среза пишется строка
  #   `SRP[<name>] срез закрыт: pages=.. ids=.. total=.. coverage=..%`
  # и общая `Autotrader coverage: slices=.. ids=.. total=.. coverage=..% truncated=.. gaps=..`.
  # Пустой/низкий coverage = срез недобран (проверять по логам, не «на глаз»).
  segmentation:
    enabled: true
    strategy: price_x_year
    price_segments:
      - [0, 8000]
      - [8000, 12000]
      - [12000, 16000]
      - [16000, 20000]
      - [20000, 25000]
      - [25000, 30000]
      - [30000, 40000]
      - [40000, 50000]
      - [50000, 60000]
      - [60000, 80000]
      - [80000, 120000]
      - [120000, 250000]
    year_segments:
      - [1980, 2009]
      - [2010, 2014]
      - [2015, 2017]
      - [2018, 2020]
      - [2021, 2023]
      - [2024, 2026]
    # Квота страниц на срез за прогон (0 = идти в глубину до потолка сайта).
    # 12 стр × 25 лотов ≈ 300 лотов на срез → ~21.6k лотов за проход (VDP — узкое место).
    segment_max_pages: 12
    segment_checkpoints: true
    reset_cursor_on_complete: true
    # Потолок глубины одного среза; 0 = без ограничения (квоты достаточно).
    depth_cap_pages: 0
    depth_limit_streak: 2
    # Дробление слишком широких срезов (имеет смысл при segment_max_pages: 0).
    adaptive_split: false
    max_split_depth: 3
    min_coverage_ratio: 0.85
    max_segments: 200

  # --- Транспорт ---------------------------------------------------------------
  # true = сначала curl_cffi с cookies из Playwright; challenge → браузер → revive HTTP.
  http_first: true
  # Сколько подряд HTTP-промахов (challenge/ошибка) до отключения HTTP-пути.
  http_fail_disable: 4
  # Потолок одного HTTP-запроса, сек.
  http_timeout_sec: 40
  http_max_revives: 6

  # --- Сохранение --------------------------------------------------------------
  # Буфер bulk_save: одна транзакция на пачку (как у Encar), а не на карточку.
  save_batch_size: 80
  save_flush_sec: 1.5
  # SRP-стаб вместо потери карточки, если VDP так и не отдался (требует require_vdp: false).
  stub_on_vdp_fail: false

logging:
  level: INFO
  console: true
  file: logs/autotrader_scraper.log
