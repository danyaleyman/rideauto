# Autotrader USA — отдельный конфиг (не смешивать с Encar / Che168).
# Сессия: Playwright bootstrap → cookie cache → curl_cffi HTTP (без ручных Cookie каждый раз).
# Опционально: AUTOTRADER_COOKIE / AUTOTRADER_PROXY_URL (residential для Akamai).

checkpoint:
  scope: autotrader

http:
  concurrency: 3
  timeout_total: 45
  timeout_connect: 15
  timeout_sock_read: 35
  list_page_delay_min: 0.6
  list_page_delay_max: 1.8
  transport: curl_cffi
  impersonate: chrome131

storage:
  backend: postgres
  store_raw_responses: true
  count_cars_source: autotrader
  postgres:
    dsn: ""

autotrader:
  base_url: https://www.autotrader.com
  cookie_file: ""
  cookie: ""
  auto_bootstrap: true
  skip_playwright_bootstrap: false
  bootstrap_start_url: https://www.autotrader.com/cars-for-sale/all-cars
  # Residential proxy recommended for Akamai (как Encar FloppyData):
  # bootstrap_proxy_url: http://USER:PASS@host:port
  # or env AUTOTRADER_PROXY_URL / AUTOTRADER_BOOTSTRAP_PROXY_URL
  bootstrap_proxy_url: ""
  session_file: /var/lib/rideauto/autotrader_session.json
  session_max_age_sec: 21600
  playwright_headless: true
  playwright_timeout_ms: 90000
  playwright_post_load_wait_ms: 4000
  challenge_retries: 2
  # playwright = fetch SRP/VDP inside Chromium (needed for Akamai + residential proxy)
  # http = curl_cffi after cookie bootstrap (often blocked again by Akamai)
  fetch_mode: playwright
  fetch_vdp: true
  start_page: 1
  max_pages: 2
  max_cars: 50
  detail_concurrency: 3

logging:
  level: INFO
  console: true
  file: logs/autotrader_scraper.log
